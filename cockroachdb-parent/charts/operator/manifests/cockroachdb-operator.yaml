# Source: cockroachdb-operator-chart/templates/operator.yaml
# In scoped mode the binding name includes the release namespace so each operator deployment
# gets its own binding and doesn't conflict with others.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cockroachdb-operator
  labels:
    app: "cockroach-operator"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cockroachdb-operator-role
subjects:
  - name: cockroach-operator-default
    namespace: cockroachdb
    kind: ServiceAccount
---
# Source: cockroachdb-operator-chart/templates/operator.yaml
# appLabel must stay distinct from the public operator selector. During migration both
# operators can be present, and reusing the same selector would route Service traffic
# to both operator pod sets.
# Expose the operator's prometheus and grpc servers to the SQLProxy's TenantDir.
apiVersion: v1
kind: Service
metadata:
  name: cockroach-operator
  namespace: cockroachdb
  labels:
    app: "cockroach-operator"
spec:
  ports:
    - name: grpc
      port: 9070
      targetPort: 9070
  selector:
    app: "cockroach-operator"
---
# Source: cockroachdb-operator-chart/templates/operator.yaml
# Configure how the operator will be deployed in the K8s cluster.
# NOTE: Put this last, so that permissions have already been granted when it
# starts up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockroach-operator
  namespace: cockroachdb
  labels:
    app: "cockroach-operator"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: "cockroach-operator"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: "cockroach-operator"
    spec:
      shareProcessNamespace: true
      serviceAccountName: cockroach-operator-default
      priorityClassName: cockroachdb-operator
      containers:
        - name: cockroach-operator
          image: docker.io/cockroachdb/cockroachdb-operator-v2:v1.0.0-rc.4
          args:
            # Pin metrics port so it can be properly exposed by the "ports"
            # field below even in the event of a change to the default value.
            - "-metrics-addr=0.0.0.0:8080"
            - "-rpc-addr=0.0.0.0:9070"
            - "-skip-tenant-controller=true"
            - "-disable-tenant-finalization=true"
            - "-self-signed-operator-certs=true"
          ports:
            # Expose port under specific name so that performance metrics can
            # more easily be scraped from container.
            - name: operator
              containerPort: 8080
            - name: grpc
              containerPort: 9070
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Expose K8s node name as environment variable. The operator will
            # use this to query the node and derive environmental information.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RELATED_IMAGE_INIT_CONTAINER
              value: "docker.io/cockroachdb/cockroachdb-init-container:v1.0.0-rc.4"
            - name: RELATED_IMAGE_INOTIFYWAIT
              value: "docker.io/cockroachdb/cockroachdb-cert-reloader:v1.0.0-rc.4"
            - name: CLOUD_REGION
              value: local
            # When watchNamespaces is set, restrict the operator to those namespaces only.
          resources:
            requests:
              cpu: 500m
              memory: 1000Mi
            limits:
              cpu: 2000m
              memory: 4000Mi
          volumeMounts:
            - name: certs
              mountPath: /certs
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9080
              scheme: HTTP
            # Give the operator 20 seconds to start. Then, only restart the
            # container if 3 consecutive probes fail over a period of 9 seconds.
            # Note that the operator starts up much faster than 20 seconds, but
            # restarting the container more frequently than once every ~30
            # seconds isn't useful.
            initialDelaySeconds: 20
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
              scheme: HTTP
            # Immediately start sending readiness probes. Stop sending traffic
            # if 3 consecutive probes fail over a period of 9 seconds, as the
            # container is probably overloaded or unhealthy, and it's best to
            # back off and let it recover.
            initialDelaySeconds: 0
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: certs
          # emptyDir is used because the webhook server reads certificates from
          # the filesystem. On startup, the operator copies the certificates from
          # the shared cockroach-operator-certs Secret into this volume. The Secret
          # and its certificates persist across Pod restarts.
          emptyDir: {}
---
