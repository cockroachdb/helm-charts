# WAL failover volume example.
#
# This concise example disables TLS and is intended to demonstrate only the
# walFailoverSpec. Enable TLS for production.
#
# Prerequisites:
# - Apply rbac.yaml.
# - Provision a StorageClass named fast-ssd, or replace storageClassName.
# - Ensure the CockroachDB version supports WAL failover.
# - Label Nodes for region local and configure the operator with
#   CLOUD_REGION=local.
apiVersion: crdb.cockroachlabs.com/v1beta1
kind: CrdbCluster
metadata:
  name: cockroachdb
  namespace: cockroachdb
spec:
  mode: MutableOnly
  tlsEnabled: false
  regions:
    - code: local
      cloudProvider: ""
      namespace: cockroachdb
      nodes: 3
  rollingRestartDelay: 30s
  template:
    spec:
      image: cockroachdb/cockroach:v26.3.0
      dataStore:
        volumeClaimTemplate:
          metadata: {}
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
            volumeMode: Filesystem
      walFailoverSpec:
        name: failover-dir
        size: 10Gi
        storageClassName: fast-ssd
        status: enable
      grpcPort: 26258
      sqlPort: 26257
      httpPort: 8080
      localityMappings:
        - nodeLabel: topology.kubernetes.io/region
          localityLabel: region
        - nodeLabel: topology.kubernetes.io/zone
          localityLabel: zone
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: cockroachdb
            app.kubernetes.io/instance: cockroachdb
            app.kubernetes.io/component: cockroachdb
        spec:
          serviceAccountName: cockroachdb
          containers:
            - name: cockroachdb
              resources: {}
