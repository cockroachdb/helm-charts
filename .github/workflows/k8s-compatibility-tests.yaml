name: CockroachDB Operator E2E (K8s Compatibility Matrix)

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

jobs:
  cockroachdb-operator-single-region-e2e:
    name: CockroachDB Operator Single Region Test (k8s ${{ matrix.k8s-version }})
    runs-on: [self-hosted, ubuntu_2404]

    strategy:
      fail-fast: false
      # We officially test the latest 7 GA Kubernetes versions with the operator,
      # using the latest available k3s patch for each minor version.
      # Whenever a new Kubernetes version is released, add it and remove the oldest one.
      matrix:
        k8s-version:
          - v1.31.12
          - v1.32.13
          - v1.33.4
          - v1.34.12
          - v1.35.9
          - v1.36.5
          - v1.37.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Run E2E Test
        env:
          K3DVersion: ${{ matrix.k8s-version }}
        run: |
          set -e
          echo "Using K3DVersion=$K3DVersion"
          make test/e2e/single-region
        continue-on-error: false

      - name: Clean up Docker resources
        shell: bash
        run: |
          docker container prune -f
          docker image prune -a -f
          docker volume prune -f
 
  cockroachdb-operator-multi-region-e2e:
    name: CockroachDB Operator Multi Region Test (k8s ${{ matrix.k8s-version }})
    runs-on: [self-hosted, ubuntu_2404]

    strategy:
      fail-fast: false
      # Single-region tests cover all 7 Kubernetes versions above.
      # For multi-region, we test the oldest, middle and latest versions.
      # Update these when adding a new version to the single-region matrix.
      matrix:
        k8s-version:
          - v1.31.12
          - v1.34.12
          - v1.37.1

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Run E2E Test
        env:
          K3DVersion: ${{ matrix.k8s-version }}
        run: |
          set -e
          echo "Using K3DVersion=$K3DVersion"
          make test/e2e/multi-region
        continue-on-error: false

      - name: Clean up Docker resources
        shell: bash
        run: |
          docker container prune -f
          docker image prune -a -f
          docker volume prune -f
