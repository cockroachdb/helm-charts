              wait "${debug_pid}" 2>/dev/null || true
              bash scripts/debug/azure.sh snapshot after-multi-region || true
              exit "${status}"
            }
            trap finish_debug EXIT
          fi

          unset AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_REUSE_CONTEXTS AZURE_RESOURCE_GROUP
          stdbuf -oL -eL make test/nightly-e2e/advanced/multi-region 2>&1 | tee test_output.log
      - name: Run tests (advanced features - multi region - OpenShift)
        if: ${{ matrix.provider == 'openshift' }}
        env:
          PROVIDER: ${{ matrix.provider }}
          TEST_ADVANCED_FEATURES: true
          USE_GKE_GCLOUD_AUTH_PLUGIN: true
          TMPDIR: ${{ runner.temp }}
          OPENSHIFT_DEBUG_DIR: ${{ runner.temp }}/openshift-debug
          OPENSHIFT_CLEANUP_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/cleanup
          OPENSHIFT_DEBUG_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/${{ github.run_id }}/${{ github.run_attempt }}/multi-region
          OPENSHIFT_BASE_DOMAIN: ${{ secrets.OPENSHIFT_BASE_DOMAIN }}
          OPENSHIFT_PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
          OPENSHIFT_ENABLE_SUBMARINER: "true"
          OPENSHIFT_SKIP_TEARDOWN: "false"
        run: |
          set -euo pipefail

          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/openshift.sh ensure-gcs
            bash scripts/debug/openshift.sh snapshot before-multi-region
            bash scripts/debug/openshift.sh watch 60 &
            debug_pid="$!"
            while true; do
              bash scripts/debug/openshift.sh sync || true
              sleep 15
            done &
            sync_pid="$!"
            finish_debug() {
              status="$?"
              kill "${debug_pid}" "${sync_pid}" 2>/dev/null || true
              wait "${debug_pid}" "${sync_pid}" 2>/dev/null || true
              bash scripts/debug/openshift.sh snapshot after-multi-region || true
              bash scripts/debug/openshift.sh sync || true
              exit "${status}"
            }
            trap finish_debug EXIT
          fi

          unset OPENSHIFT_REUSE_CONTEXTS OPENSHIFT_REUSE_KUBECONFIG OPENSHIFT_REUSE_KUBECONFIGS
          stdbuf -oL -eL make test/nightly-e2e/advanced/multi-region > >(tee test_output.log) 2>&1
      - name: Clean up Azure resource groups
        if: ${{ always() && matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_RESOURCE_GROUPS_FILE: ${{ runner.temp }}/azure-resource-groups.txt
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
        run: |
          set -euo pipefail
          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/azure.sh snapshot cleanup-before-multi-region || true
          fi
          cleanup_status=0
          bash scripts/cleanup/azure.sh recorded-resource-groups || cleanup_status="$?"
          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/azure.sh snapshot cleanup-after-multi-region || true
          fi
          exit "${cleanup_status}"
      - name: Archive test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: advanced-multi-region-results-${{ matrix.provider }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test_output.log
            test_output.json
            ${{ runner.temp }}/azure-resource-groups.txt
            ${{ runner.temp }}/helm-charts-ocp-*/metadata.json
      - name: Archive cloud debug diagnostics
        if: ${{ always() && env.E2E_DEBUG == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: advanced-multi-region-debug-${{ matrix.provider }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/azure-debug/*.log
            ${{ runner.temp }}/openshift-debug/*.log
            ${{ runner.temp }}/helm-charts-ocp-*/.openshift_install.log
      - name: Clean up OpenShift installer state
        if: ${{ always() && matrix.provider == 'openshift' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          OPENSHIFT_DEBUG_DIR: ${{ runner.temp }}/openshift-debug
          OPENSHIFT_CLEANUP_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/cleanup
          OPENSHIFT_DEBUG_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/${{ github.run_id }}/${{ github.run_attempt }}/multi-region
          OPENSHIFT_BASE_DOMAIN: ${{ secrets.OPENSHIFT_BASE_DOMAIN }}
          OPENSHIFT_SKIP_TEARDOWN: "false"
        run: |
          set -euo pipefail
          cleanup_status=0
          bash scripts/cleanup/openshift.sh recorded-installs || cleanup_status=1
          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/openshift.sh sync || cleanup_status=1
          fi
          exit "${cleanup_status}"
      - name: Slack notification
        # Temporarily disabled because notification failures can mask test results.
        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Advanced features multi-region"
          provider: ${{ matrix.provider }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
