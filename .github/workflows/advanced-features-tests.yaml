        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Advanced features multi-region"
          provider: ${{ matrix.provider }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
