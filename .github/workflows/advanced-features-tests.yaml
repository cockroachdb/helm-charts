name: advanced-features-tests

on:
  schedule:
    - cron: "15 8 * * 2"  # Run at 8:15 AM on every Tuesday UTC to avoid peak times
  # Allow manual trigger on any branch
  workflow_dispatch:

env:
  OPENSHIFT_VERSION: "4.17.16"
  SUBCTL_VERSION: "v0.24.0"

jobs:
  advanced-features-single-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [k3d, kind, gcp, openshift, azure]
    timeout-minutes: 300
    concurrency:
      group: ${{ matrix.provider == 'azure' && format('helm-charts-azure-e2e-{0}-advanced-single-region', github.ref_name) || matrix.provider == 'openshift' && 'advanced-features-openshift' || format('advanced-features-{0}-{1}-{2}', github.run_id, github.job, matrix.provider) }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Authenticate to Google Cloud
        if: ${{ matrix.provider == 'gcp' || matrix.provider == 'openshift' }}
        uses: 'google-github-actions/auth@v2'
        id: auth
        with:
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud CLI
        if: ${{ matrix.provider == 'gcp' || matrix.provider == 'openshift' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Install gke-gcloud-auth-plugin
        if: ${{ matrix.provider == 'gcp' || matrix.provider == 'openshift' }}
        run: |
          gcloud components install gke-gcloud-auth-plugin
      - name: Authenticate to Azure
        if: ${{ matrix.provider == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure CLI
        if: ${{ matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          az version
          az account show --subscription "${AZURE_SUBSCRIPTION_ID}" --output table
      - name: Clean up stale Azure resource groups
        if: ${{ matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_TICKET: CC-35912
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
        run: |
          set -euo pipefail
          ./build/azure-ci-debug.sh snapshot before-stale-cleanup
          stale_status=0
          ./build/azure-ci-debug.sh cleanup-old-resource-groups || stale_status="$?"
          ./build/azure-ci-debug.sh snapshot after-stale-cleanup
          exit "${stale_status}"
      - name: Install OpenShift tools
        if: ${{ matrix.provider == 'openshift' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin

          curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OPENSHIFT_VERSION}/openshift-install-linux.tar.gz" \
            -o "${RUNNER_TEMP}/openshift-install-linux.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openshift-install-linux.tar.gz" -C bin openshift-install

          curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OPENSHIFT_VERSION}/openshift-client-linux.tar.gz" \
            -o "${RUNNER_TEMP}/openshift-client-linux.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openshift-client-linux.tar.gz" -C bin oc kubectl

          chmod +x bin/openshift-install bin/oc bin/kubectl

          echo "${PWD}/bin" >> "${GITHUB_PATH}"
          bin/openshift-install version
          bin/oc version --client
          bin/kubectl version --client
      - name: Generate OpenShift SSH key
        if: ${{ matrix.provider == 'openshift' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh-keygen -t ed25519 -N "" -f "${RUNNER_TEMP}/openshift-ci-ssh-key" -C "helm-charts-ci@cockroachlabs.com"
          {
            echo "OPENSHIFT_SSH_PUB_KEY<<EOF"
            cat "${RUNNER_TEMP}/openshift-ci-ssh-key.pub"
            echo "EOF"
          } >> "${GITHUB_ENV}"
      - name: Run tests (advanced features - single region)
        if: ${{ matrix.provider != 'openshift' && matrix.provider != 'azure' }}
        env:
          PROVIDER: ${{ matrix.provider }}
          TEST_ADVANCED_FEATURES: true
          USE_GKE_GCLOUD_AUTH_PLUGIN: true
        run: |
          set -euo pipefail
          make test/nightly-e2e/advanced/single-region | tee test_output.log
      - name: Run tests (advanced features - single region - Azure)
        if: ${{ matrix.provider == 'azure' }}
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
          TEST_ADVANCED_FEATURES: true
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_TICKET: CC-35912
          AZURE_RESOURCE_GROUPS_FILE: ${{ runner.temp }}/azure-resource-groups.txt
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
          E2E_ADVANCED_SINGLE_REGION_TEST_TIMEOUT: 120m
        run: |
          set -euo pipefail

          ./build/azure-ci-debug.sh snapshot before-single-region
          ./build/azure-ci-debug.sh watch 120 &
          debug_pid="$!"
          finish_debug() {
            status="$?"
            kill "${debug_pid}" 2>/dev/null || true
            wait "${debug_pid}" 2>/dev/null || true
            ./build/azure-ci-debug.sh snapshot after-single-region || true
            exit "${status}"
          }
          trap finish_debug EXIT

          unset AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_REUSE_CONTEXTS AZURE_RESOURCE_GROUP
          stdbuf -oL -eL make test/nightly-e2e/advanced/single-region 2>&1 | tee test_output.log
      - name: Run tests (advanced features - single region - OpenShift)
        if: ${{ matrix.provider == 'openshift' }}
        env:
          PROVIDER: ${{ matrix.provider }}
          TEST_ADVANCED_FEATURES: true
          USE_GKE_GCLOUD_AUTH_PLUGIN: true
          TMPDIR: ${{ runner.temp }}
          OPENSHIFT_DEBUG_DIR: ${{ runner.temp }}/openshift-debug
          OPENSHIFT_DEBUG_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/${{ github.run_id }}/${{ github.run_attempt }}/single-region
          OPENSHIFT_BASE_DOMAIN: ${{ secrets.OPENSHIFT_BASE_DOMAIN }}
          OPENSHIFT_PULL_SECRET: ${{ secrets.OPENSHIFT_PULL_SECRET }}
          OPENSHIFT_ENABLE_SUBMARINER: "false"
          OPENSHIFT_SKIP_TEARDOWN: "false"
        run: |
          set -euo pipefail

          ./build/openshift-ci-debug.sh ensure-gcs
          ./build/openshift-ci-debug.sh snapshot before-single-region
          ./build/openshift-ci-debug.sh watch 120 &
          debug_pid="$!"
          finish_debug() {
            status="$?"
            kill "${debug_pid}" 2>/dev/null || true
            wait "${debug_pid}" 2>/dev/null || true
            ./build/openshift-ci-debug.sh snapshot after-single-region || true
            ./build/openshift-ci-debug.sh sync || true
            exit "${status}"
          }
          trap finish_debug EXIT

          unset OPENSHIFT_REUSE_CONTEXTS OPENSHIFT_REUSE_KUBECONFIG OPENSHIFT_REUSE_KUBECONFIGS
          stdbuf -oL -eL make test/nightly-e2e/advanced/single-region 2>&1 | tee test_output.log
      - name: Clean up Azure resource groups
        if: ${{ always() && matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TICKET: CC-35912
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_RESOURCE_GROUPS_FILE: ${{ runner.temp }}/azure-resource-groups.txt
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
        run: |
          set -euo pipefail
          ./build/azure-ci-debug.sh snapshot cleanup-before-single-region || true
          cleanup_status=0
          ./build/azure-ci-debug.sh cleanup-resource-groups || cleanup_status="$?"
          ./build/azure-ci-debug.sh snapshot cleanup-after-single-region || true
          exit "${cleanup_status}"
      - name: Archive test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: advanced-single-region-results-${{ matrix.provider }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            test_output.log
            test_output.json
            ${{ runner.temp }}/azure-debug/*.log
            ${{ runner.temp }}/azure-resource-groups.txt
            ${{ runner.temp }}/openshift-debug/*.log
            ${{ runner.temp }}/helm-charts-ocp-*/.openshift_install.log
            ${{ runner.temp }}/helm-charts-ocp-*/metadata.json
      - name: Clean up OpenShift installer state
        if: ${{ always() && matrix.provider == 'openshift' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          OPENSHIFT_DEBUG_DIR: ${{ runner.temp }}/openshift-debug
          OPENSHIFT_DEBUG_GCS_URI: gs://${{ secrets.GCP_PROJECT_ID }}-openshift-ci-debug/${{ github.run_id }}/${{ github.run_attempt }}/single-region
          OPENSHIFT_BASE_DOMAIN: ${{ secrets.OPENSHIFT_BASE_DOMAIN }}
          OPENSHIFT_SKIP_TEARDOWN: "false"
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ "${OPENSHIFT_SKIP_TEARDOWN}" == "true" ]]; then
            echo "OPENSHIFT_SKIP_TEARDOWN=true; preserving OpenShift installer state"
            ./build/openshift-ci-debug.sh snapshot skip-teardown-single-region || true
            ./build/openshift-ci-debug.sh sync || true
            exit 0
          fi

          ./build/openshift-ci-debug.sh cleanup-multicluster || true

          for install_dir in "${TMPDIR}"/helm-charts-ocp-*; do
            [[ -d "${install_dir}" ]] || continue
            echo "Destroying leftover OpenShift cluster from ${install_dir}"
            openshift-install destroy cluster --dir "${install_dir}" --log-level info || true
            rm -rf "${install_dir}"
          done
      - name: Slack notification
        # Temporarily disabled because notification failures can mask test results.
        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Advanced features single-region"
          provider: ${{ matrix.provider }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  advanced-features-multi-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [k3d, kind, gcp, openshift, azure]
    timeout-minutes: 420
    concurrency:
      group: ${{ matrix.provider == 'azure' && format('helm-charts-azure-e2e-{0}-advanced-multi-region', github.ref_name) || matrix.provider == 'openshift' && 'advanced-features-openshift' || format('advanced-features-{0}-{1}-{2}', github.run_id, github.job, matrix.provider) }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
