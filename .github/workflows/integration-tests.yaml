name: integration-tests

on:
  schedule:
    - cron: "15 6 * * 1"  # Run at 6:15 AM on every Monday UTC to avoid peak times
  # Allow manual trigger on any branch
  workflow_dispatch:

jobs:
  integration-tests-multi-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, gcp]
    timeout-minutes: 90
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin
      - name: Run tests (multi-region)
        env:
          PROVIDER: ${{ matrix.provider }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: True
        run: |
          set -euo pipefail
          make test/e2e/multi-region | tee test_output.log
      - name: Archive test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-region-test-results-${{ matrix.provider }}
          path: |
            test_output.log
            test_output.json
      - name: Slack notification (multi-region)
        # Temporarily disabled because notification failures can mask test results.
        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Multi-region e2e"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
  integration-tests-single-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, gcp]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        id: auth
        with:
          token_format: access_token
          project_id: 'cockroach-helm-testing'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin
      - name: Run tests (single-region)
        env:
          PROVIDER: ${{ matrix.provider }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: True
        run: |
          set -euo pipefail
          make test/e2e/single-region | tee test_output.log
      - name: Archive test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: single-region-test-results-${{ matrix.provider }}
          path: |
            test_output.log
            test_output.json
      - name: Slack notification (single-region)
        # Temporarily disabled because notification failures can mask test results.
        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Single-region e2e"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
