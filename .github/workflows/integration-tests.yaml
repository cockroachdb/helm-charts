name: integration-tests

on:
  schedule:
    - cron: "15 6 * * 1"  # Run at 6:15 AM on every Monday UTC to avoid peak times
  # Allow manual trigger on any branch
  workflow_dispatch:
    inputs:
      collect_debug:
        description: Collect extra cloud debug snapshots and logs
        type: boolean
        default: false

env:
  E2E_DEBUG: ${{ inputs.collect_debug || false }}

jobs:
  integration-tests-multi-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, gcp, azure]
    timeout-minutes: ${{ matrix.provider == 'azure' && 180 || 90 }}
    concurrency:
      group: ${{ matrix.provider == 'azure' && format('helm-charts-azure-e2e-{0}-integration-multi-region', github.ref_name) || format('integration-tests-{0}-{1}-{2}', github.run_id, github.job, matrix.provider) }}
      cancel-in-progress: false
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Authenticate to Google Cloud
        if: ${{ matrix.provider == 'gcp' }}
        uses: 'google-github-actions/auth@v2'
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud CLI
        if: ${{ matrix.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Install gke-gcloud-auth-plugin
        if: ${{ matrix.provider == 'gcp' }}
        run: |
          gcloud components install gke-gcloud-auth-plugin
      - name: Authenticate to Azure
        if: ${{ matrix.provider == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure CLI
        if: ${{ matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          az version
          az account show --subscription "${AZURE_SUBSCRIPTION_ID}" --output table
      - name: Run tests (multi-region)
        if: ${{ matrix.provider != 'azure' }}
        env:
          PROVIDER: ${{ matrix.provider }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: True
        run: |
          set -euo pipefail
          make test/e2e/multi-region | tee test_output.log
      - name: Run tests (multi-region - Azure)
        if: ${{ matrix.provider == 'azure' }}
        shell: bash
        env:
          PROVIDER: ${{ matrix.provider }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_RESOURCE_GROUPS_FILE: ${{ runner.temp }}/azure-resource-groups.txt
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
          E2E_MULTI_REGION_TEST_TIMEOUT: 150m
        run: |
          set -euo pipefail

          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/azure.sh snapshot before-multi-region
            bash scripts/debug/azure.sh watch 120 &
            debug_pid="$!"
            finish_debug() {
              status="$?"
              kill "${debug_pid}" 2>/dev/null || true
              wait "${debug_pid}" 2>/dev/null || true
              bash scripts/debug/azure.sh snapshot after-multi-region || true
              exit "${status}"
            }
            trap finish_debug EXIT
          fi

          unset AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_REUSE_CONTEXTS AZURE_RESOURCE_GROUP
          stdbuf -oL -eL make test/e2e/multi-region 2>&1 | tee test_output.log
      - name: Clean up Azure resource groups
        if: ${{ always() && matrix.provider == 'azure' }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_PREFIX: hc-e2e
          AZURE_RESOURCE_GROUPS_FILE: ${{ runner.temp }}/azure-resource-groups.txt
          AZURE_DEBUG_DIR: ${{ runner.temp }}/azure-debug
        run: |
          set -euo pipefail
          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/azure.sh snapshot cleanup-before-multi-region || true
          fi
          cleanup_status=0
          bash scripts/cleanup/azure.sh recorded-resource-groups || cleanup_status="$?"
          if [[ "${E2E_DEBUG}" == "true" ]]; then
            bash scripts/debug/azure.sh snapshot cleanup-after-multi-region || true
          fi
          exit "${cleanup_status}"
      - name: Archive test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-region-test-results-${{ matrix.provider }}
          path: |
            test_output.log
            test_output.json
            ${{ runner.temp }}/azure-resource-groups.txt
      - name: Archive cloud debug diagnostics
        if: ${{ always() && env.E2E_DEBUG == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-region-debug-${{ matrix.provider }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/azure-debug/*.log
      - name: Slack notification (multi-region)
        # Temporarily disabled because notification failures can mask test results.
        # Re-enable or replace once CC-36671 is resolved.
        if: ${{ false }}
        uses: ./.github/actions/slack-test-notification
        with:
          test-name: "Multi-region e2e"
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
  integration-tests-single-region:
    runs-on: [self-hosted, ubuntu_2404]
    strategy:
      fail-fast: false
      matrix:
        provider: [kind, gcp, azure]
    timeout-minutes: ${{ matrix.provider == 'azure' && 150 || 90 }}
    concurrency:
      group: ${{ matrix.provider == 'azure' && format('helm-charts-azure-e2e-{0}-integration-single-region', github.ref_name) || format('integration-tests-{0}-{1}-{2}', github.run_id, github.job, matrix.provider) }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Authenticate to Google Cloud
        if: ${{ matrix.provider == 'gcp' }}
        uses: 'google-github-actions/auth@v2'
        id: auth
        with:
          token_format: access_token
          project_id: 'cockroach-helm-testing'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud CLI
        if: ${{ matrix.provider == 'gcp' }}
