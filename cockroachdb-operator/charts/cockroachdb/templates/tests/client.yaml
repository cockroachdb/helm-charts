kind: Pod
apiVersion: v1
metadata:
  name: {{ template "cockroachdb.fullname" . }}-test
  namespace: {{ .Release.Namespace | quote }}
  {{- with .Values.cockroachdb.tests.podLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    helm.sh/hook: test-success
    {{- with .Values.cockroachdb.tests.podAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  restartPolicy: Never
{{- if .Values.cockroachdb.crdbCluster.image.credentials }}
  imagePullSecrets:
    - name: {{ template "cockroachdb.fullname" . }}.db.registry
{{- end }}
  {{- if .Values.cockroachdb.tls.enabled }}
  volumes:
    - name: client-certs
      projected:
        defaultMode: 0400
        sources:
          - secret:
              name: {{ include "cockroachdb.tests.rootClientSecretName" . }}
              items:
                - key: tls.crt
                  path: client.root.crt
                - key: tls.key
                  path: client.root.key
          - configMap:
              name: {{ include "cockroachdb.tests.caConfigMapName" . }}
              items:
                - key: ca.crt
                  path: ca.crt
  {{- end }}
  containers:
    - name: client-test
      image: "{{ .Values.cockroachdb.crdbCluster.image.name }}"
      imagePullPolicy: {{ .Values.cockroachdb.crdbCluster.image.pullPolicy | quote }}
      {{- if .Values.cockroachdb.tls.enabled }}
      volumeMounts:
      - name: client-certs
        mountPath: /cockroach-certs
      {{- end }}
      command:
        - /cockroach/cockroach
        - sql
        {{- if .Values.cockroachdb.tls.enabled }}
        - --certs-dir
        - /cockroach-certs
        {{- else }}
        - --insecure
        {{- end}}
        - --host
        - {{ template "cockroachdb.fullname" . }}-public.{{ .Release.Namespace }}
        - --port
        - {{ .Values.cockroachdb.crdbCluster.service.ports.sql.port | quote }}
        - -e
        - SHOW DATABASES;
